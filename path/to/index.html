<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Web Trend Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 36px;
            color: #333;
        }
        .content {
            text-align: center;
            margin-bottom: 20px;
        }
        .content p {
            font-size: 18px;
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Family Web Trend Invitation</h1>
        </div>
        <div class="content">
            <p>Join us for a special event with us!</p>
            <p>RSVP by <a href="https://example.com/rsvp"> clicking here</a>.</p>
            <p>Don't forget to bring your favorite <a href="https://example.com/dress-code">dress code</a>.</p>
            <p>For more information, please contact us at <a href="https://example.com/contact">contact@example.com</a>.</p>
        </div>
        <div class="button">
            <a href="https://example.com/rsvp">RSVP Now</a>
        </div>
    </div>
</body>
</html>
